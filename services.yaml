swap:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    date:
      required: true
      selector: { date: }
    cook:
      required: true
      example: "Libertad"
      selector: { text: }
reassign:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    date:
      required: true
      selector: { date: }
    cook:
      required: true
      example: "Libertad"
      selector: { text: }
skip:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    date:
      required: true
      selector: { date: }
complete:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    date:
      required: true
      selector: { date: }
regenerate:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
get_plan:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    start:
      selector: { date: }
    end:
      selector: { date: }
get_history:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    start:
      required: true
      selector: { date: }
    end:
      required: true
      selector: { date: }
set_menu:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    date:
      required: true
      selector: { date: }
    title:
      example: "Tacos"
      selector: { text: }
    dish_id:
      selector: { text: }
    kind:
      selector:
        select:
          options: [home, eating_out, leftovers, skip]
          translation_key: menu_kind
    note:
      selector: { text: }
    rating:
      selector: { number: { min: 1, max: 5, mode: box } }
create_dish:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    name:
      required: true
      example: "Tacos"
      selector: { text: }
    aliases:
      selector: { text: { multiple: true } }
    tags:
      selector: { text: { multiple: true } }
    recipe:
      selector: { object: }
update_dish:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    dish_id:
      required: true
      selector: { text: }
    name:
      selector: { text: }
    aliases:
      selector: { text: { multiple: true } }
    tags:
      selector: { text: { multiple: true } }
    recipe:
      selector: { object: }
delete_dish:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    dish_id:
      required: true
      selector: { text: }
list_dishes:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
set_unavailable:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    cook:
      required: true
      example: "Libertad"
      selector: { text: }
    start:
      required: true
      selector: { date: }
    end:
      required: true
      selector: { date: }
clear_unavailable:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    cook:
      required: true
      example: "Libertad"
      selector: { text: }
    start:
      selector: { date: }
    end:
      selector: { date: }
get_stats:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    period:
      selector: { number: { min: 1, max: 3650, mode: box, unit_of_measurement: days } }
generate_tips:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
add_ingredients_to_list:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    date:
      selector: { date: }
    todo_entity:
      selector: { entity: { domain: todo } }
import_from_entity:
  fields:
    config_entry_id:
      selector: { config_entry: { integration: dinnersense } }
    entity_id:
      required: true
      example: input_text.today_s_dinner
      selector:
        entity:
          filter:
            - domain: input_text
            - domain: text
    days:
      default: 10
      selector: { number: { min: 1, max: 365, mode: box, unit_of_measurement: days } }
    overwrite:
      default: false
      selector: { boolean: }
